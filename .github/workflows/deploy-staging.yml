name: Deploy AI7 UAE landing page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - Dockerfile
      - nginx.conf
      - infrastructure/main.bicep
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai7uae-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ai7uae
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-web"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --pull --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show \
            --name "${{ vars.ACR_NAME }}" \
            --image "${repository}:${tag}" \
            --query digest \
            --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          printf '{"repository":"%s","source_sha":"%s","run_id":"%s","run_attempt":"%s","digest":"%s","image":"%s"}\n' \
            "${repository}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${digest}" "${image}" \
            > deployment-evidence.json

      - name: Validate Bicep
        run: |
          az bicep build --file infrastructure/platform.bicep
          az bicep build --file infrastructure/dns.bicep
          az bicep build --file infrastructure/main.bicep

      - name: Preview infrastructure change
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/main.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              apexCertificateId="${{ vars.APEX_CERTIFICATE_RESOURCE_ID }}" \
              wwwCertificateId="${{ vars.WWW_CERTIFICATE_RESOURCE_ID }}"

      - name: Deploy digest-pinned revision
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/main.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              apexCertificateId="${{ vars.APEX_CERTIFICATE_RESOURCE_ID }}" \
              wwwCertificateId="${{ vars.WWW_CERTIFICATE_RESOURCE_ID }}" \
            --query properties.outputs \
            --output json > deployment-outputs.json

      - name: Retain deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai7uae-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-evidence.json
            deployment-outputs.json
          if-no-files-found: error
          retention-days: 30

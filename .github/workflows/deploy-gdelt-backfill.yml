name: Deploy GDELT archive backfill

on:
  workflow_dispatch:
    inputs:
      reviewedMainSha:
        description: Exact reviewed main commit already published by the production API workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai7uae-gdelt-archive-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ai7uae-api
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4

      - name: Verify exact reviewed commit
        shell: bash
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewedMainSha }}
        run: |
          set -euo pipefail
          [[ "${REVIEWED_MAIN_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "${GITHUB_SHA}" = "${REVIEWED_MAIN_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate archive templates
        run: |
          az bicep build --file infrastructure/api-gdelt-job.bicep
          az bicep build --file infrastructure/api-gdelt-backfill-job.bicep

      - name: Verify existing archive and resolve published image
        id: archive
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          test -n "${AZURE_RESOURCE_GROUP}" && test -n "${ACR_NAME}" && test -n "${ACR_LOGIN_SERVER}"
          job="$(az containerapp job show --resource-group "${AZURE_RESOURCE_GROUP}" --name caj-ai7uae-gdelt-ingest --output json)"
          jq -e --arg registry "${ACR_LOGIN_SERVER}" \
            '(.location | ascii_downcase == "uae north") and (.properties.environmentId | endswith("/managedEnvironments/cae-ai7uae-web-uaen-001")) and .properties.configuration.triggerType == "Schedule" and .properties.configuration.scheduleTriggerConfig.cronExpression == "30 1 * * *" and .properties.configuration.scheduleTriggerConfig.parallelism == 1 and .properties.template.containers[0].command == ["node", "scripts/gdelt-ingest.mjs"] and .properties.configuration.registries[0].server == $registry' \
            <<< "${job}" > /dev/null
          environment_id="$(jq -r .properties.environmentId <<< "${job}")"
          identity_id="$(az identity show --resource-group "${AZURE_RESOURCE_GROUP}" --name id-ai7uae-gdelt-ingest --query id --output tsv)"
          identity_client="$(az identity show --resource-group "${AZURE_RESOURCE_GROUP}" --name id-ai7uae-gdelt-ingest --query clientId --output tsv)"
          jq -e --arg identity "${identity_id}" '.identity.userAssignedIdentities | keys | any(ascii_downcase == ($identity | ascii_downcase))' <<< "${job}" > /dev/null
          storage="$(az storage account show --resource-group "${AZURE_RESOURCE_GROUP}" --name stai7uaegdeltuaen001 --query '{name:name,location:location}' --output json)"
          jq -e '.name == "stai7uaegdeltuaen001" and (.location | ascii_downcase == "uaenorth")' <<< "${storage}" > /dev/null
          digest="$(az acr repository show --name "${ACR_NAME}" --image "ai7uae-api:${GITHUB_SHA}" --query digest --output tsv)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "image=${ACR_LOGIN_SERVER}/ai7uae-api@${digest}"
            echo "environment_id=${environment_id}"
            echo "identity_id=${identity_id}"
            echo "identity_client=${identity_client}"
          } >> "${GITHUB_OUTPUT}"
          printf '{"source_sha":"%s","image_digest":"%s","archive_job":"%s","backfill_job":"%s"}\n' \
            "${GITHUB_SHA}" "${digest}" caj-ai7uae-gdelt-ingest caj-ai7uae-gdelt-backfill > gdelt-deployment-evidence.json

      - name: Preview daily and weekly job changes
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINERAPPS_ENVIRONMENT_ID: ${{ steps.archive.outputs.environment_id }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE: ${{ steps.archive.outputs.image }}
          IDENTITY_ID: ${{ steps.archive.outputs.identity_id }}
          IDENTITY_CLIENT: ${{ steps.archive.outputs.identity_client }}
        run: |
          set -euo pipefail
          for template in infrastructure/api-gdelt-job.bicep infrastructure/api-gdelt-backfill-job.bicep; do
            if [[ "${template}" == *backfill* ]]; then
              expected='caj-ai7uae-gdelt-backfill'
            else
              expected='caj-ai7uae-gdelt-ingest'
            fi
            changes="$(az deployment group what-if --resource-group "${AZURE_RESOURCE_GROUP}" --template-file "${template}" \
              --parameters image="${IMAGE}" environmentId="${CONTAINERAPPS_ENVIRONMENT_ID}" \
                ingestionIdentityResourceId="${IDENTITY_ID}" ingestionIdentityClientId="${IDENTITY_CLIENT}" \
                acrLoginServer="${ACR_LOGIN_SERVER}" \
              --no-pretty-print --query "changes[?changeType!='Ignore'].{type:changeType,id:resourceId}" --output json)"
            jq -e --arg expected "${expected}" \
              'length == 1 and all(.[]; . as $change | ($change.id | endswith("/Microsoft.App/jobs/" + $expected)) and (["NoChange", "Create", "Modify"] | index($change.type) != null))' \
              <<< "${changes}" > /dev/null
            jq -c . <<< "${changes}"
          done

      - name: Update daily ingest before enabling backfill
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINERAPPS_ENVIRONMENT_ID: ${{ steps.archive.outputs.environment_id }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE: ${{ steps.archive.outputs.image }}
          IDENTITY_ID: ${{ steps.archive.outputs.identity_id }}
          IDENTITY_CLIENT: ${{ steps.archive.outputs.identity_client }}
        run: |
          set -euo pipefail
          az deployment group create --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "gdelt-daily-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-gdelt-job.bicep \
            --parameters image="${IMAGE}" environmentId="${CONTAINERAPPS_ENVIRONMENT_ID}" \
              ingestionIdentityResourceId="${IDENTITY_ID}" ingestionIdentityClientId="${IDENTITY_CLIENT}" \
              acrLoginServer="${ACR_LOGIN_SERVER}" --output none
          deployed="$(az containerapp job show --resource-group "${AZURE_RESOURCE_GROUP}" --name caj-ai7uae-gdelt-ingest --query 'properties.template.containers[0].image' --output tsv)"
          test "${deployed}" = "${IMAGE}"

      - name: Enable Saturday backfill
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINERAPPS_ENVIRONMENT_ID: ${{ steps.archive.outputs.environment_id }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE: ${{ steps.archive.outputs.image }}
          IDENTITY_ID: ${{ steps.archive.outputs.identity_id }}
          IDENTITY_CLIENT: ${{ steps.archive.outputs.identity_client }}
        run: |
          set -euo pipefail
          az deployment group create --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "gdelt-weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-gdelt-backfill-job.bicep \
            --parameters image="${IMAGE}" environmentId="${CONTAINERAPPS_ENVIRONMENT_ID}" \
              ingestionIdentityResourceId="${IDENTITY_ID}" ingestionIdentityClientId="${IDENTITY_CLIENT}" \
              acrLoginServer="${ACR_LOGIN_SERVER}" --output none
          schedule="$(az containerapp job show --resource-group "${AZURE_RESOURCE_GROUP}" --name caj-ai7uae-gdelt-backfill --query 'properties.configuration.scheduleTriggerConfig.cronExpression' --output tsv)"
          deployed="$(az containerapp job show --resource-group "${AZURE_RESOURCE_GROUP}" --name caj-ai7uae-gdelt-backfill --query 'properties.template.containers[0].image' --output tsv)"
          test "${schedule}" = '0 18 * * 6'
          test "${deployed}" = "${IMAGE}"

      - name: Retain deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-archive-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: gdelt-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

name: Deploy AI7 UAE API

on:
  push:
    branches: [main]
    paths:
      - api-site/**
      - admin-site/**
      - flow-site/**
      - docs/flo/**
      - api/**
      - lib/**
      - scripts/**
      - test/**
      - server.mjs
      - package.json
      - package-lock.json
      - Dockerfile.api
      - Dockerfile.merchant-screenshot
      - bank-statement-analysis/**
      - ejari-verifier/**
      - merchant-screenshot-worker.mjs
      - infrastructure/api.bicep
      - infrastructure/api-flo-platform.bicep
      - infrastructure/api-dns.bicep
      - infrastructure/merchant-screenshot-platform.bicep
      - infrastructure/api-bank-statement-platform.bicep
      - infrastructure/api-document-ocr-platform.bicep
      - infrastructure/api-ejari-platform.bicep
      - Dockerfile.document-ocr
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
    inputs:
      enableDeepResearchWorker:
        description: Keep the adverse-media deep-research worker enabled; uncheck only for a controlled pause
        type: boolean
        default: true
      provisionDocumentOcrPlatform:
        description: Provision only the isolated document OCR Azure platform; customer OCR routes remain disabled until DOCUMENT_OCR_ENABLED is true
        type: boolean
        default: false
      provisionCaseManagerPlatform:
        description: BLOCKED pending reviewed private-network path; selecting this fails closed
        type: boolean
        default: false
      provisionEjariPlatform:
        description: Provision the private Ejari storage, worker identity and access roles; API stays off until EJARI_PLATFORM_ENABLED is true
        type: boolean
        default: false
      provisionFloPlatform:
        description: Provision Flo child container, table and queues in the existing private storage account; runtime remains controlled by FLO_ENABLED
        type: boolean
        default: false

# DOCUMENT_OCR_ENABLED is an environment variable set only after all eight
# sample-based accuracy gates and the dedicated Gemini credential are ready.

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai7uae-api-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: ai7uae-api
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Install locked API dependencies
        run: npm ci --omit=dev

      - name: Test API contract and isolation
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Ejari worker and encryption compatibility
        run: |
          python -m pip install -r ejari-verifier/requirements.txt
          PYTHONPATH=ejari-verifier/src python -m unittest discover -s ejari-verifier/tests -v

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Case Manager private data-plane proof before capture
        id: case_manager_private_path
        if: vars.CASE_MANAGER_MAINTENANCE_ENABLED == 'true' || (vars.CASE_MANAGER_DESIRED_ENABLED == 'true' && vars.CASE_MANAGER_EMERGENCY_OFF != 'true')
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINERAPPS_ENVIRONMENT_ID: ${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}
          CASE_MANAGER_PRIVATE_ENVIRONMENT_ID: ${{ vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID }}
          CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID: ${{ vars.CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID }}
          RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}
        run: |
          set -euo pipefail
          test -n "${CASE_MANAGER_PRIVATE_ENVIRONMENT_ID}"
          test "${CONTAINERAPPS_ENVIRONMENT_ID}" = "${CASE_MANAGER_PRIVATE_ENVIRONMENT_ID}"
          node scripts/verify-case-manager-private-release.mjs >> "$GITHUB_OUTPUT"

      - name: Resolve persistent Case Manager deployment state
        id: case_manager_state
        env:
          CASE_MANAGER_DESIRED_ENABLED: ${{ vars.CASE_MANAGER_DESIRED_ENABLED }}
          CASE_MANAGER_EMERGENCY_OFF: ${{ vars.CASE_MANAGER_EMERGENCY_OFF }}
          CASE_MANAGER_MAINTENANCE_ENABLED: ${{ vars.CASE_MANAGER_MAINTENANCE_ENABLED }}
          CASE_MANAGER_PRIVATE_PATH_VERIFIED: ${{ steps.case_manager_private_path.outputs.verified }}
        run: node scripts/resolve-case-manager-deployment.mjs >> "$GITHUB_OUTPUT"

      - name: Enforce distinct VNet cutover resources and certificates
        if: vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID != '' && vars.CONTAINERAPPS_ENVIRONMENT_ID == vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID
        env:
          PRIVATE_ENVIRONMENT_ID: ${{ vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID }}
          API_CONTAINER_APP_NAME: ${{ vars.API_CONTAINER_APP_NAME }}
          MERCHANT_SCREENSHOT_WORKER_NAME: ${{ vars.MERCHANT_SCREENSHOT_WORKER_NAME }}
          BSA_WORKER_NAME: ${{ vars.BSA_WORKER_NAME }}
          DOCUMENT_OCR_WORKER_NAME: ${{ vars.DOCUMENT_OCR_WORKER_NAME }}
          DOCUMENT_OCR_PURGE_JOB_NAME: ${{ vars.DOCUMENT_OCR_PURGE_JOB_NAME }}
          CASE_MANAGER_PURGE_JOB_NAME: ${{ vars.CASE_MANAGER_PURGE_JOB_NAME }}
          CASE_MANAGER_RECONCILE_JOB_NAME: ${{ vars.CASE_MANAGER_RECONCILE_JOB_NAME }}
          PARALLEL_DEPLOYMENT: ${{ vars.CASE_MANAGER_PARALLEL_QA }}
          CASE_MANAGER_DESIRED_ENABLED: ${{ vars.CASE_MANAGER_DESIRED_ENABLED }}
          CASE_MANAGER_MAINTENANCE_ENABLED: ${{ vars.CASE_MANAGER_MAINTENANCE_ENABLED }}
          API_CERTIFICATE_RESOURCE_ID: ${{ vars.API_CERTIFICATE_RESOURCE_ID }}
          APP_CERTIFICATE_RESOURCE_ID: ${{ vars.KYCPROBE_APP_CERTIFICATE_RESOURCE_ID }}
        run: |
          set -euo pipefail
          test -n "${API_CONTAINER_APP_NAME}" && test "${API_CONTAINER_APP_NAME}" != 'ca-ai7uae-api'
          test -n "${MERCHANT_SCREENSHOT_WORKER_NAME}" && test "${MERCHANT_SCREENSHOT_WORKER_NAME}" != 'ca-ai7uae-merchant-screenshot'
          test -n "${BSA_WORKER_NAME}" && test "${BSA_WORKER_NAME}" != 'ca-ai7uae-bsa-worker'
          test -n "${DOCUMENT_OCR_WORKER_NAME}" && test "${DOCUMENT_OCR_WORKER_NAME}" != 'ca-ai7uae-document-ocr-worker'
          test -n "${DOCUMENT_OCR_PURGE_JOB_NAME}" && test "${DOCUMENT_OCR_PURGE_JOB_NAME}" != 'caj-ai7uae-document-ocr-purge'
          test -n "${CASE_MANAGER_PURGE_JOB_NAME}" && test "${CASE_MANAGER_PURGE_JOB_NAME}" != 'caj-ai7uae-case-manager-purge'
          test -n "${CASE_MANAGER_RECONCILE_JOB_NAME}" && test "${CASE_MANAGER_RECONCILE_JOB_NAME}" != 'caj-ai7uae-case-manager-reconcile'
          if [[ "${PARALLEL_DEPLOYMENT}" == 'true' ]]; then
            test "${CASE_MANAGER_DESIRED_ENABLED}" != 'true'
            test "${CASE_MANAGER_MAINTENANCE_ENABLED}" != 'true'
            test -z "${API_CERTIFICATE_RESOURCE_ID}"
            test -z "${APP_CERTIFICATE_RESOURCE_ID}"
          else
            [[ "${API_CERTIFICATE_RESOURCE_ID}" == "${PRIVATE_ENVIRONMENT_ID}/managedCertificates/"* ]]
            [[ "${APP_CERTIFICATE_RESOURCE_ID}" == "${PRIVATE_ENVIRONMENT_ID}/managedCertificates/"* ]]
          fi

      - name: Block parallel mode on the existing live environment
        if: vars.CASE_MANAGER_PARALLEL_QA == 'true' && vars.CONTAINERAPPS_ENVIRONMENT_ID != vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID
        run: exit 1

      - name: Build and publish immutable API image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-api"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --pull --file Dockerfile.api --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          printf '{"repository":"%s","source_sha":"%s","run_id":"%s","run_attempt":"%s","digest":"%s","image":"%s","case_manager_enabled":%s,"case_manager_maintenance":%s}\n' \
            "${repository}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${digest}" "${image}" \
            "${{ steps.case_manager_state.outputs.enabled }}" "${{ steps.case_manager_state.outputs.maintenance }}" \
            > api-deployment-evidence.json

      - name: Build and publish immutable merchant screenshot worker image
        id: merchant_screenshot_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-merchant-screenshot"
          context_digest="$(git ls-tree -r HEAD -- .dockerignore Dockerfile.merchant-screenshot package.json package-lock.json merchant-screenshot-worker.mjs lib/merchant-screening.mjs lib/merchant-screening-network.mjs lib/merchant-screenshot.mjs | sha256sum | cut -d ' ' -f 1)"
          if test "${context_digest}" = '0712e1f3a4c93e4fbed3c6eb21c2343efad4d0faac5dcdbbecfaa34b0f2e1b51'; then
            digest='sha256:e40a66f7934e8312047b3daca989b27ca281b8e7b7e340ae88d3817d5edde28b'
            image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
            live_image="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.MERCHANT_SCREENSHOT_WORKER_NAME || 'ca-ai7uae-merchant-screenshot' }}" --query 'properties.template.containers[0].image' --output tsv)"
            test "${live_image}" = "${image}"
            registry_digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}@${digest}" --query digest --output tsv)"
            test "${registry_digest}" = "${digest}"
            reused_from='41375647682-1:0fa711bc923a6d0bb433a51d3637a31f7ad3af4f'
          else
            tag="${GITHUB_SHA}"
            tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
            docker build --pull --file Dockerfile.merchant-screenshot --tag "${tagged_image}" .
            docker push "${tagged_image}"
            digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
            test -n "${digest}"
            reused_from=''
          fi
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" --arg reused_from "${reused_from}" \
            '.merchant_screenshot_worker = ({repository: $repository, digest: $digest, image: $image} + (if $reused_from == "" then {} else {reused_from: $reused_from} end))' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Build and publish immutable bank statement worker image
        id: bank_statement_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-bank-statement-worker"
          # Run 41353275323 built this digest from the exact source tree below.
          # Reuse it only while the BSA source and deployed image still match;
          # the pinned ModelScope download currently returns HTTP 500.
          if test "$(git rev-parse HEAD:bank-statement-analysis)" = 'cd4d54a755cd56e981ba5409e4f9cf6b4b640ae8'; then
            digest='sha256:513c825e40322833e60ce0577c3f63f048dd3970ce593e8a7c2b654605414ae7'
            image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
            live_image="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.BSA_WORKER_NAME || 'ca-ai7uae-bsa-worker' }}" --query 'properties.template.containers[0].image' --output tsv)"
            test "${live_image}" = "${image}"
            registry_digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}@${digest}" --query digest --output tsv)"
            test "${registry_digest}" = "${digest}"
            reused_from='41353275323-1:b4fdeab34a24cbab2c509aa41d288a60fdf092d9'
          else
            tag="${GITHUB_SHA}"
            tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
            docker build --pull --file bank-statement-analysis/Dockerfile --tag "${tagged_image}" bank-statement-analysis
            docker push "${tagged_image}"
            digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
            test -n "${digest}"
            reused_from=''
          fi
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" --arg reused_from "${reused_from}" \
            '.bank_statement_worker = ({repository: $repository, digest: $digest, image: $image} + (if $reused_from == "" then {} else {reused_from: $reused_from} end))' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Build and publish immutable document OCR worker image
        id: document_ocr_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-document-ocr-worker"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          docker build --pull --file Dockerfile.document-ocr --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" \
            '.document_ocr_worker = {repository: $repository, digest: $digest, image: $image}' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Build and publish immutable Ejari worker image
        id: ejari_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-ejari-worker"
          if test "${{ vars.EJARI_PLATFORM_ENABLED }}" = 'true' && test "$(git rev-parse HEAD:ejari-verifier)" = '139433aca32581d9343f190fa18ee8aecbbc056a'; then
            digest='sha256:9e77ce9d77a70f77e043e67161f64fe59e354df8401c803e7b24544e0e3e2955'
            image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
            live_image="$(az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name 'ca-ai7uae-ejari-worker' --query 'properties.template.containers[0].image' --output tsv)"
            test "${live_image}" = "${image}"
            registry_digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}@${digest}" --query digest --output tsv)"
            test "${registry_digest}" = "${digest}"
            reused_from='41375647682-1:0fa711bc923a6d0bb433a51d3637a31f7ad3af4f'
          else
            tag="${GITHUB_SHA}"
            tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
            docker build --pull --file ejari-verifier/Dockerfile --tag "${tagged_image}" ejari-verifier
            docker push "${tagged_image}"
            digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
            test -n "${digest}"
            reused_from=''
          fi
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" --arg reused_from "${reused_from}" \
            '.ejari_worker = ({repository: $repository, digest: $digest, image: $image} + (if $reused_from == "" then {} else {reused_from: $reused_from} end))' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Validate API Bicep
        run: |
          az bicep build --file infrastructure/api.bicep
          az bicep build --file infrastructure/api-flo-platform.bicep
          az bicep build --file infrastructure/api-dns.bicep
          az bicep build --file infrastructure/api-document-ocr-platform.bicep
          az bicep build --file infrastructure/api-case-manager-platform.bicep
          az bicep build --file infrastructure/api-case-manager-network.bicep
          az bicep build --file infrastructure/api-case-manager-private-probe.bicep
          az bicep build --file infrastructure/api-case-manager-cutover-certificates.bicep
          az bicep build --file infrastructure/api-case-manager-release-reader.bicep
          az bicep build --file infrastructure/api-ejari-platform.bicep

      - name: Verify production Flo private storage path
        if: (github.event_name == 'workflow_dispatch' && inputs.provisionFloPlatform) || vars.FLO_ENABLED == 'true'
        shell: bash
        env:
          FLO_STORAGE_ACCOUNT_NAME: ${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}
        run: |
          set -euo pipefail
          storage="$(az storage account show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${FLO_STORAGE_ACCOUNT_NAME}" \
            --query '{id:id,publicNetworkAccess:publicNetworkAccess,allowSharedKeyAccess:allowSharedKeyAccess,allowBlobPublicAccess:allowBlobPublicAccess}' --output json)"
          jq -e '.publicNetworkAccess == "Disabled" and .allowSharedKeyAccess == false and .allowBlobPublicAccess == false' <<< "${storage}" > /dev/null
          storage_id="$(jq -r .id <<< "${storage}")"
          node scripts/verify-flo-private-storage.mjs "${storage_id}"
          runtime_principal="$(az identity show --ids "${RUNTIME_IDENTITY_RESOURCE_ID}" --query principalId --output tsv)"
          az role assignment list --assignee-object-id "${runtime_principal}" --scope "${storage_id}" --include-inherited --output json \
            | jq -e '[.[].roleDefinitionName] as $roles | all("Storage Blob Data Contributor", "Storage Table Data Contributor", "Storage Queue Data Contributor"; . as $role | $roles | index($role) != null)' > /dev/null

      - name: Preview Flo child storage resources
        if: github.event_name == 'workflow_dispatch' && inputs.provisionFloPlatform
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-flo-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-flo-platform.bicep \
            --parameters storageAccountName="${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}"

      - name: Provision Flo child storage resources
        if: github.event_name == 'workflow_dispatch' && inputs.provisionFloPlatform
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-flo-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-flo-platform.bicep \
            --parameters storageAccountName="${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}"

      - name: Verify Flo production enablement prerequisites
        if: vars.FLO_ENABLED == 'true'
        shell: bash
        env:
          FLO_STORAGE_ACCOUNT_NAME: ${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          KEY_VAULT_URI: ${{ vars.KEY_VAULT_URI }}
          FLO_CERTIFICATE_RESOURCE_ID: ${{ vars.FLO_CERTIFICATE_RESOURCE_ID }}
          CONTAINERAPPS_ENVIRONMENT_ID: ${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}
          CASE_MANAGER_PRIVATE_ENVIRONMENT_ID: ${{ vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID }}
          CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID: ${{ vars.CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID }}
          CASE_MANAGER_PARALLEL_QA: ${{ vars.CASE_MANAGER_PARALLEL_QA }}
          RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}
        run: |
          set -euo pipefail
          test "${CASE_MANAGER_PARALLEL_QA}" != 'true'
          test -n "${CASE_MANAGER_PRIVATE_ENVIRONMENT_ID}"
          test "${CONTAINERAPPS_ENVIRONMENT_ID,,}" = "${CASE_MANAGER_PRIVATE_ENVIRONMENT_ID,,}"
          test "${FLO_STORAGE_ACCOUNT_NAME}" = 'stai7uaecasesuaen001'
          node scripts/verify-case-manager-private-release.mjs > /dev/null
          storage_id="$(az storage account show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${FLO_STORAGE_ACCOUNT_NAME}" --query id --output tsv)"
          for child in \
            blobServices/default/containers/flo-evidence \
            tableServices/default/tables/FloCases \
            queueServices/default/queues/flo-jobs \
            queueServices/default/queues/flo-callbacks \
            queueServices/default/queues/flo-dead-letter; do
            az resource show --ids "${storage_id}/${child}" --api-version 2023-05-01 --query id --output tsv > /dev/null
          done
          test -n "${KEY_VAULT_URI}" && test -n "${FLO_CERTIFICATE_RESOURCE_ID}"
          vault_name="${KEY_VAULT_URI#https://}"
          vault_name="${vault_name%%.*}"
          vault_id="$(az keyvault show --resource-group "${AZURE_RESOURCE_GROUP}" --name "${vault_name}" --query id --output tsv)"
          for secret in flo-data-key-v1 flo-session-hash-key-v1 flo-callback-signing-key-v1 flo-gemini-api-key; do
            enabled="$(az resource show --ids "${vault_id}/secrets/${secret}" --api-version 2023-07-01 --query properties.attributes.enabled --output tsv)"
            test "${enabled}" = 'True' || test "${enabled}" = 'true'
          done
          case "${FLO_CERTIFICATE_RESOURCE_ID,,}" in
            "${CONTAINERAPPS_ENVIRONMENT_ID,,}"/managedcertificates/*) ;;
            *) echo 'Flo certificate must belong to the production Container Apps environment.' >&2; exit 1 ;;
          esac
          az resource show --ids "${FLO_CERTIFICATE_RESOURCE_ID}" --query id --output tsv > /dev/null
          clamav_image="$(grep -oE 'ai7uae-clamav@sha256:[a-f0-9]{64}' infrastructure/api.bicep | head -1)"
          test -n "${clamav_image}"
          az acr repository show --name "${{ vars.ACR_NAME }}" --image "${clamav_image}" --query digest --output tsv > /dev/null

      - name: Provision private Ejari platform
        if: github.event_name == 'workflow_dispatch' && inputs.provisionEjariPlatform
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID }}"
          vault_uri="${{ vars.KEY_VAULT_URI }}"
          vault_name="${vault_uri#https://}"
          vault_name="${vault_name%%.*}"
          registry_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.ContainerRegistry/registries/${{ vars.ACR_NAME }}"
          vault_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.KeyVault/vaults/${vault_name}"
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ejari-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-ejari-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}" privateEndpointSubnetId="${{ vars.CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID }}"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ejari-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-ejari-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}" privateEndpointSubnetId="${{ vars.CASE_MANAGER_PRIVATE_ENDPOINT_SUBNET_ID }}"

      - name: Verify private Ejari platform before enabling
        if: vars.EJARI_PLATFORM_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" = "${{ vars.CASE_MANAGER_PRIVATE_ENVIRONMENT_ID }}"
          az storage account show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name stai7uaeejariuaen001 \
            --query '{publicNetworkAccess:publicNetworkAccess,allowSharedKeyAccess:allowSharedKeyAccess}' --output json \
            | jq -e '.publicNetworkAccess == "Disabled" and .allowSharedKeyAccess == false' > /dev/null
          az identity show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name id-ai7uae-ejari-worker-uaen-001 \
            --query principalId --output tsv | grep -E '^[a-zA-Z0-9-]+$'
          for group in blob table queue; do
            state="$(az network private-endpoint show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "pe-ai7uae-ejari-${group}-uaen-001" \
              --query 'privateLinkServiceConnections[0].privateLinkServiceConnectionState.status' --output tsv)"
            test "${state}" = 'Approved'
          done

      - name: Block Case Manager provisioning until private connectivity is reviewed
        if: github.event_name == 'workflow_dispatch' && inputs.provisionCaseManagerPlatform
        run: |
          echo 'Case Manager provisioning is blocked until the API runtime has a reviewed VNet and private Blob, Table and Queue endpoints.' >&2
          exit 1

      - name: Deploy isolated document OCR resources
        if: github.event_name == 'workflow_dispatch' && inputs.provisionDocumentOcrPlatform
        shell: bash
        run: |
          set -euo pipefail
          vault_uri="${{ vars.KEY_VAULT_URI }}"
          vault_name="${vault_uri#https://}"
          vault_name="${vault_name%%.*}"
          registry_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.ContainerRegistry/registries/${{ vars.ACR_NAME }}"
          vault_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.KeyVault/vaults/${vault_name}"
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ocr-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-document-ocr-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ocr-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-document-ocr-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}"

      - name: Verify isolated document OCR resources
        if: vars.DOCUMENT_OCR_ENABLED == 'true' || vars.DOCUMENT_OCR_WORKER_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          group="${{ vars.AZURE_RESOURCE_GROUP }}"
          account="$(az cognitiveservices account show --resource-group "${group}" --name doc-ai7uae-ocr-uaen-001 --query '{location:location,sku:sku.name,localAuthDisabled:properties.disableLocalAuth}' --output json)"
          storage="$(az storage account show --resource-group "${group}" --name stai7uaeocruaen001 --query '{location:location,sharedKeyAllowed:allowSharedKeyAccess,publicBlobAllowed:allowBlobPublicAccess}' --output json)"
          identity="$(az identity show --resource-group "${group}" --name id-ai7uae-ocr-worker-uaen-001 --query '{location:location,principalId:principalId}' --output json)"
          jq -e '.location == "uaenorth" and .sku == "S0" and .localAuthDisabled == true' <<< "${account}" > /dev/null
          jq -e '.location == "uaenorth" and .sharedKeyAllowed == false and .publicBlobAllowed == false' <<< "${storage}" > /dev/null
          jq -e '.location == "uaenorth" and (.principalId | type == "string" and length > 0)' <<< "${identity}" > /dev/null

      - name: Preview API infrastructure change
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              merchantScreenshotWorkerImage="${{ steps.merchant_screenshot_image.outputs.image }}" \
              bankStatementWorkerImage="${{ steps.bank_statement_image.outputs.image }}" \
              documentOcrWorkerImage="${{ steps.document_ocr_image.outputs.image }}" \
              ejariWorkerImage="${{ steps.ejari_image.outputs.image }}" \
              enableEjari="${{ vars.EJARI_PLATFORM_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcr="${{ vars.DOCUMENT_OCR_ENABLED == 'true' && 'true' || 'false' }}" \
              enableTaedMoa="${{ vars.DOCUMENT_OCR_TAED_MOA_ENABLED == 'true' && 'true' || 'false' }}" \
              enableTaedTradeLicense="${{ vars.DOCUMENT_OCR_TAED_TRADE_LICENSE_ENABLED == 'true' && 'true' || 'false' }}" \
              enableAdverseMediaSearchPlusGpt="${{ vars.ADVERSE_MEDIA_SEARCH_PLUS_GPT_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrWorker="${{ vars.DOCUMENT_OCR_WORKER_ENABLED == 'true' && 'true' || 'false' }}" \
              enableCaseManager="${{ steps.case_manager_state.outputs.enabled }}" \
              enableFlo="${{ vars.FLO_ENABLED == 'true' && 'true' || 'false' }}" \
              enableFloWorkflowPlatform="${{ vars.FLO_WORKFLOW_PLATFORM_ENABLED != 'false' && 'true' || 'false' }}" \
              maintainCaseManagerData="${{ steps.case_manager_state.outputs.maintenance }}" \
              parallelDeployment="${{ vars.CASE_MANAGER_PARALLEL_QA == 'true' && 'true' || 'false' }}" \
              apiTrafficCutover="${{ vars.CASE_MANAGER_TRAFFIC_CUTOVER == 'true' && 'true' || 'false' }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              containerAppName="${{ vars.API_CONTAINER_APP_NAME || 'ca-ai7uae-api' }}" \
              merchantScreenshotWorkerName="${{ vars.MERCHANT_SCREENSHOT_WORKER_NAME || 'ca-ai7uae-merchant-screenshot' }}" \
              bankStatementWorkerName="${{ vars.BSA_WORKER_NAME || 'ca-ai7uae-bsa-worker' }}" \
              documentOcrWorkerName="${{ vars.DOCUMENT_OCR_WORKER_NAME || 'ca-ai7uae-document-ocr-worker' }}" \
              documentOcrPurgeJobName="${{ vars.DOCUMENT_OCR_PURGE_JOB_NAME || 'caj-ai7uae-document-ocr-purge' }}" \
              caseManagerPurgeJobName="${{ vars.CASE_MANAGER_PURGE_JOB_NAME || 'caj-ai7uae-case-manager-purge' }}" \
              caseManagerReconcileJobName="${{ vars.CASE_MANAGER_RECONCILE_JOB_NAME || 'caj-ai7uae-case-manager-reconcile' }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              runtimeIdentityClientId="${{ vars.RUNTIME_IDENTITY_CLIENT_ID }}" \
              caseManagerStorageName="${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              keyVaultUri="${{ vars.KEY_VAULT_URI }}" \
              apiCertificateId="${{ vars.API_CERTIFICATE_RESOURCE_ID }}" \
              appCertificateId="${{ vars.KYCPROBE_APP_CERTIFICATE_RESOURCE_ID }}" \
              floCertificateId="${{ vars.FLO_CERTIFICATE_RESOURCE_ID }}" \
              floDiagnosticWorkspaceId="${{ vars.FLO_DIAGNOSTIC_WORKSPACE_ID }}" \
              floDiagnosticApplicationId="${{ vars.FLO_DIAGNOSTIC_APPLICATION_ID }}" \
              enableDeepResearchWorker="${{ github.event_name == 'push' && 'true' || (inputs.enableDeepResearchWorker && 'true' || 'false') }}"

      - name: Deploy digest-pinned API revision
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              merchantScreenshotWorkerImage="${{ steps.merchant_screenshot_image.outputs.image }}" \
              bankStatementWorkerImage="${{ steps.bank_statement_image.outputs.image }}" \
              documentOcrWorkerImage="${{ steps.document_ocr_image.outputs.image }}" \
              ejariWorkerImage="${{ steps.ejari_image.outputs.image }}" \
              enableEjari="${{ vars.EJARI_PLATFORM_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcr="${{ vars.DOCUMENT_OCR_ENABLED == 'true' && 'true' || 'false' }}" \
              enableTaedMoa="${{ vars.DOCUMENT_OCR_TAED_MOA_ENABLED == 'true' && 'true' || 'false' }}" \
              enableTaedTradeLicense="${{ vars.DOCUMENT_OCR_TAED_TRADE_LICENSE_ENABLED == 'true' && 'true' || 'false' }}" \
              enableAdverseMediaSearchPlusGpt="${{ vars.ADVERSE_MEDIA_SEARCH_PLUS_GPT_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrWorker="${{ vars.DOCUMENT_OCR_WORKER_ENABLED == 'true' && 'true' || 'false' }}" \
              enableCaseManager="${{ steps.case_manager_state.outputs.enabled }}" \
              enableFlo="${{ vars.FLO_ENABLED == 'true' && 'true' || 'false' }}" \
              enableFloWorkflowPlatform="${{ vars.FLO_WORKFLOW_PLATFORM_ENABLED != 'false' && 'true' || 'false' }}" \
              maintainCaseManagerData="${{ steps.case_manager_state.outputs.maintenance }}" \
              parallelDeployment="${{ vars.CASE_MANAGER_PARALLEL_QA == 'true' && 'true' || 'false' }}" \
              apiTrafficCutover="${{ vars.CASE_MANAGER_TRAFFIC_CUTOVER == 'true' && 'true' || 'false' }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              containerAppName="${{ vars.API_CONTAINER_APP_NAME || 'ca-ai7uae-api' }}" \
              merchantScreenshotWorkerName="${{ vars.MERCHANT_SCREENSHOT_WORKER_NAME || 'ca-ai7uae-merchant-screenshot' }}" \
              bankStatementWorkerName="${{ vars.BSA_WORKER_NAME || 'ca-ai7uae-bsa-worker' }}" \
              documentOcrWorkerName="${{ vars.DOCUMENT_OCR_WORKER_NAME || 'ca-ai7uae-document-ocr-worker' }}" \
              documentOcrPurgeJobName="${{ vars.DOCUMENT_OCR_PURGE_JOB_NAME || 'caj-ai7uae-document-ocr-purge' }}" \
              caseManagerPurgeJobName="${{ vars.CASE_MANAGER_PURGE_JOB_NAME || 'caj-ai7uae-case-manager-purge' }}" \
              caseManagerReconcileJobName="${{ vars.CASE_MANAGER_RECONCILE_JOB_NAME || 'caj-ai7uae-case-manager-reconcile' }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              runtimeIdentityClientId="${{ vars.RUNTIME_IDENTITY_CLIENT_ID }}" \
              caseManagerStorageName="${{ vars.FLO_STORAGE_ACCOUNT_NAME || 'stai7uaecasesuaen001' }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              keyVaultUri="${{ vars.KEY_VAULT_URI }}" \
              apiCertificateId="${{ vars.API_CERTIFICATE_RESOURCE_ID }}" \
              appCertificateId="${{ vars.KYCPROBE_APP_CERTIFICATE_RESOURCE_ID }}" \
              floCertificateId="${{ vars.FLO_CERTIFICATE_RESOURCE_ID }}" \
              floDiagnosticWorkspaceId="${{ vars.FLO_DIAGNOSTIC_WORKSPACE_ID }}" \
              floDiagnosticApplicationId="${{ vars.FLO_DIAGNOSTIC_APPLICATION_ID }}" \
              enableDeepResearchWorker="${{ github.event_name == 'push' && 'true' || (inputs.enableDeepResearchWorker && 'true' || 'false') }}" \
            --query properties.outputs \
            --output json > api-deployment-outputs.json

      - name: Retain API deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai7uae-api-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api-deployment-evidence.json
            api-deployment-outputs.json
          if-no-files-found: error
          retention-days: 30

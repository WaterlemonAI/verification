name: Deploy AI7 UAE API

on:
  push:
    branches: [main]
    paths:
      - api-site/**
      - admin-site/**
      - api/**
      - lib/**
      - scripts/**
      - test/**
      - server.mjs
      - package.json
      - package-lock.json
      - Dockerfile.api
      - Dockerfile.merchant-screenshot
      - bank-statement-analysis/**
      - merchant-screenshot-worker.mjs
      - infrastructure/api.bicep
      - infrastructure/merchant-screenshot-platform.bicep
      - infrastructure/api-bank-statement-platform.bicep
      - infrastructure/api-document-ocr-platform.bicep
      - Dockerfile.document-ocr
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
    inputs:
      enableDeepResearchWorker:
        description: Keep the adverse-media deep-research worker enabled; uncheck only for a controlled pause
        type: boolean
        default: true
      provisionDocumentOcrPlatform:
        description: Provision only the isolated document OCR Azure platform; customer OCR routes remain disabled until DOCUMENT_OCR_ENABLED is true
        type: boolean
        default: false

# DOCUMENT_OCR_ENABLED is an environment variable set only after all eight
# sample-based accuracy gates and the dedicated Gemini credential are ready.

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai7uae-api-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: ai7uae-api
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Install locked API dependencies
        run: npm ci --omit=dev

      - name: Test API contract and isolation
        run: npm test

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish immutable API image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-api"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build --pull --file Dockerfile.api --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          printf '{"repository":"%s","source_sha":"%s","run_id":"%s","run_attempt":"%s","digest":"%s","image":"%s"}\n' \
            "${repository}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${digest}" "${image}" \
            > api-deployment-evidence.json

      - name: Build and publish immutable merchant screenshot worker image
        id: merchant_screenshot_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-merchant-screenshot"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          docker build --pull --file Dockerfile.merchant-screenshot --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" \
            '.merchant_screenshot_worker = {repository: $repository, digest: $digest, image: $image}' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Build and publish immutable bank statement worker image
        id: bank_statement_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-bank-statement-worker"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          docker build --pull --file bank-statement-analysis/Dockerfile --tag "${tagged_image}" bank-statement-analysis
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" \
            '.bank_statement_worker = {repository: $repository, digest: $digest, image: $image}' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Build and publish immutable document OCR worker image
        id: document_ocr_image
        shell: bash
        run: |
          set -euo pipefail
          repository="ai7uae-document-ocr-worker"
          tag="${GITHUB_SHA}"
          tagged_image="${{ vars.ACR_LOGIN_SERVER }}/${repository}:${tag}"
          docker build --pull --file Dockerfile.document-ocr --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "${repository}:${tag}" --query digest --output tsv)"
          test -n "${digest}"
          image="${{ vars.ACR_LOGIN_SERVER }}/${repository}@${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          jq --arg repository "${repository}" --arg digest "${digest}" --arg image "${image}" \
            '.document_ocr_worker = {repository: $repository, digest: $digest, image: $image}' \
            api-deployment-evidence.json > api-deployment-evidence.next.json
          mv api-deployment-evidence.next.json api-deployment-evidence.json

      - name: Validate API Bicep
        run: |
          az bicep build --file infrastructure/api.bicep
          az bicep build --file infrastructure/api-document-ocr-platform.bicep

      - name: Deploy isolated document OCR resources
        if: github.event_name == 'workflow_dispatch' && inputs.provisionDocumentOcrPlatform
        shell: bash
        run: |
          set -euo pipefail
          vault_uri="${{ vars.KEY_VAULT_URI }}"
          vault_name="${vault_uri#https://}"
          vault_name="${vault_name%%.*}"
          registry_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.ContainerRegistry/registries/${{ vars.ACR_NAME }}"
          vault_id="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.KeyVault/vaults/${vault_name}"
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ocr-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-document-ocr-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}"
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-ocr-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-document-ocr-platform.bicep \
            --parameters apiRuntimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" registryId="${registry_id}" keyVaultId="${vault_id}"

      - name: Verify isolated document OCR resources
        if: vars.DOCUMENT_OCR_ENABLED == 'true' || vars.DOCUMENT_OCR_WORKER_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          group="${{ vars.AZURE_RESOURCE_GROUP }}"
          account="$(az cognitiveservices account show --resource-group "${group}" --name doc-ai7uae-ocr-uaen-001 --query '{location:location,sku:sku.name,localAuthDisabled:properties.disableLocalAuth}' --output json)"
          storage="$(az storage account show --resource-group "${group}" --name stai7uaeocruaen001 --query '{location:location,sharedKeyAllowed:allowSharedKeyAccess,publicBlobAllowed:allowBlobPublicAccess}' --output json)"
          identity="$(az identity show --resource-group "${group}" --name id-ai7uae-ocr-worker-uaen-001 --query '{location:location,principalId:principalId}' --output json)"
          jq -e '.location == "uaenorth" and .sku == "S0" and .localAuthDisabled == true' <<< "${account}" > /dev/null
          jq -e '.location == "uaenorth" and .sharedKeyAllowed == false and .publicBlobAllowed == false' <<< "${storage}" > /dev/null
          jq -e '.location == "uaenorth" and (.principalId | type == "string" and length > 0)' <<< "${identity}" > /dev/null

      - name: Preview API infrastructure change
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              merchantScreenshotWorkerImage="${{ steps.merchant_screenshot_image.outputs.image }}" \
              bankStatementWorkerImage="${{ steps.bank_statement_image.outputs.image }}" \
              documentOcrWorkerImage="${{ steps.document_ocr_image.outputs.image }}" \
              enableDocumentOcr="${{ vars.DOCUMENT_OCR_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrWorker="${{ vars.DOCUMENT_OCR_WORKER_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrPaddle="${{ vars.DOCUMENT_OCR_PADDLE_ENABLED == 'true' && 'true' || 'false' }}" \
              enableFormsAiAction="${{ vars.FORMS_AI_ACTION_ENABLED == 'true' && 'true' || 'false' }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              runtimeIdentityClientId="${{ vars.RUNTIME_IDENTITY_CLIENT_ID }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              keyVaultUri="${{ vars.KEY_VAULT_URI }}" \
              apiCertificateId="${{ vars.API_CERTIFICATE_RESOURCE_ID }}" \
              appCertificateId="${{ vars.KYCPROBE_APP_CERTIFICATE_RESOURCE_ID }}" \
              enableDeepResearchWorker="${{ github.event_name == 'push' && 'true' || (inputs.enableDeepResearchWorker && 'true' || 'false') }}"

      - name: Deploy digest-pinned API revision
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "ai7uae-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep \
            --parameters \
              image="${{ steps.image.outputs.image }}" \
              merchantScreenshotWorkerImage="${{ steps.merchant_screenshot_image.outputs.image }}" \
              bankStatementWorkerImage="${{ steps.bank_statement_image.outputs.image }}" \
              documentOcrWorkerImage="${{ steps.document_ocr_image.outputs.image }}" \
              enableDocumentOcr="${{ vars.DOCUMENT_OCR_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrWorker="${{ vars.DOCUMENT_OCR_WORKER_ENABLED == 'true' && 'true' || 'false' }}" \
              enableDocumentOcrPaddle="${{ vars.DOCUMENT_OCR_PADDLE_ENABLED == 'true' && 'true' || 'false' }}" \
              enableFormsAiAction="${{ vars.FORMS_AI_ACTION_ENABLED == 'true' && 'true' || 'false' }}" \
              environmentId="${{ vars.CONTAINERAPPS_ENVIRONMENT_ID }}" \
              runtimeIdentityResourceId="${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}" \
              runtimeIdentityClientId="${{ vars.RUNTIME_IDENTITY_CLIENT_ID }}" \
              acrLoginServer="${{ vars.ACR_LOGIN_SERVER }}" \
              keyVaultUri="${{ vars.KEY_VAULT_URI }}" \
              apiCertificateId="${{ vars.API_CERTIFICATE_RESOURCE_ID }}" \
              appCertificateId="${{ vars.KYCPROBE_APP_CERTIFICATE_RESOURCE_ID }}" \
              enableDeepResearchWorker="${{ github.event_name == 'push' && 'true' || (inputs.enableDeepResearchWorker && 'true' || 'false') }}" \
            --query properties.outputs \
            --output json > api-deployment-outputs.json

      - name: Retain API deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai7uae-api-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api-deployment-evidence.json
            api-deployment-outputs.json
          if-no-files-found: error
          retention-days: 30

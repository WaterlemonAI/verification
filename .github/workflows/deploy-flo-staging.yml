name: Deploy Flo staging

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed Flo commit to build and deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: flo-staging
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: flo-staging
    env:
      STAGING_RESOURCE_GROUP: ${{ vars.STAGING_RESOURCE_GROUP }}
      STAGING_ENVIRONMENT_ID: ${{ vars.STAGING_ENVIRONMENT_ID }}
      STAGING_RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.STAGING_RUNTIME_IDENTITY_RESOURCE_ID }}
      STAGING_RUNTIME_IDENTITY_CLIENT_ID: ${{ vars.STAGING_RUNTIME_IDENTITY_CLIENT_ID }}
      STAGING_ACR_LOGIN_SERVER: ${{ vars.STAGING_ACR_LOGIN_SERVER }}
      STAGING_KEY_VAULT_URI: ${{ vars.STAGING_KEY_VAULT_URI }}
      STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
      STAGING_APP_HOST: ${{ vars.STAGING_APP_HOST }}
      STAGING_FLO_HOST: ${{ vars.STAGING_FLO_HOST }}
      STAGING_API_CERTIFICATE_ID: ${{ vars.STAGING_API_CERTIFICATE_ID }}
      STAGING_APP_CERTIFICATE_ID: ${{ vars.STAGING_APP_CERTIFICATE_ID }}
      STAGING_FLO_CERTIFICATE_ID: ${{ vars.STAGING_FLO_CERTIFICATE_ID }}
      STAGING_API_APP_NAME: ${{ vars.STAGING_API_APP_NAME }}
      STAGING_MERCHANT_WORKER_NAME: ${{ vars.STAGING_MERCHANT_WORKER_NAME }}
      STAGING_BSA_WORKER_NAME: ${{ vars.STAGING_BSA_WORKER_NAME }}
      STAGING_OCR_WORKER_NAME: ${{ vars.STAGING_OCR_WORKER_NAME }}
      STAGING_OCR_PURGE_JOB_NAME: ${{ vars.STAGING_OCR_PURGE_JOB_NAME }}
      STAGING_EJARI_WORKER_NAME: ${{ vars.STAGING_EJARI_WORKER_NAME }}
      STAGING_EJARI_PURGE_JOB_NAME: ${{ vars.STAGING_EJARI_PURGE_JOB_NAME }}
      STAGING_MERCHANT_IDENTITY_NAME: ${{ vars.STAGING_MERCHANT_IDENTITY_NAME }}
      STAGING_BSA_IDENTITY_NAME: ${{ vars.STAGING_BSA_IDENTITY_NAME }}
      STAGING_OCR_IDENTITY_NAME: ${{ vars.STAGING_OCR_IDENTITY_NAME }}
      STAGING_EJARI_IDENTITY_NAME: ${{ vars.STAGING_EJARI_IDENTITY_NAME }}
      STAGING_BSA_STORAGE_NAME: ${{ vars.STAGING_BSA_STORAGE_NAME }}
      STAGING_OCR_STORAGE_NAME: ${{ vars.STAGING_OCR_STORAGE_NAME }}
      STAGING_FLO_STORAGE_NAME: ${{ vars.STAGING_FLO_STORAGE_NAME }}
      STAGING_EJARI_STORAGE_NAME: ${{ vars.STAGING_EJARI_STORAGE_NAME }}
      STAGING_DEEP_RESEARCH_STORAGE_NAME: ${{ vars.STAGING_DEEP_RESEARCH_STORAGE_NAME }}
      STAGING_GDELT_STORAGE_NAME: ${{ vars.STAGING_GDELT_STORAGE_NAME }}
      STAGING_REPORT_STORAGE_NAME: ${{ vars.STAGING_REPORT_STORAGE_NAME }}
      STAGING_ADVERSE_JSON_STORAGE_NAME: ${{ vars.STAGING_ADVERSE_JSON_STORAGE_NAME }}
      STAGING_LOG_WORKSPACE_NAME: ${{ vars.STAGING_LOG_WORKSPACE_NAME }}
      STAGING_BSA_DOCUMENT_ENDPOINT: ${{ vars.STAGING_BSA_DOCUMENT_ENDPOINT }}
      STAGING_OCR_ENDPOINT: ${{ vars.STAGING_OCR_ENDPOINT }}
      STAGING_API_ALERT_EMAIL: ${{ vars.STAGING_API_ALERT_EMAIL }}
      STAGING_ALERT_RESOURCE_PREFIX: ${{ vars.STAGING_ALERT_RESOURCE_PREFIX }}
      STAGING_ALERT_GROUP_SHORT_NAME: ${{ vars.STAGING_ALERT_GROUP_SHORT_NAME }}
      STAGING_BILLING_JOB_NAME: ${{ vars.STAGING_BILLING_JOB_NAME }}
      STAGING_PEPPOL_JOB_NAME: ${{ vars.STAGING_PEPPOL_JOB_NAME }}
      STAGING_SMTP_USER: ${{ vars.STAGING_SMTP_USER }}
      STAGING_MERCHANT_IMAGE: ${{ vars.STAGING_MERCHANT_IMAGE }}
      STAGING_BSA_IMAGE: ${{ vars.STAGING_BSA_IMAGE }}
      STAGING_OCR_IMAGE: ${{ vars.STAGING_OCR_IMAGE }}
      STAGING_EJARI_IMAGE: ${{ vars.STAGING_EJARI_IMAGE }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0

      - name: Verify exact commit and staging configuration
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [[ "${REVIEWED_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${REVIEWED_SHA}"
          git merge-base --is-ancestor "${REVIEWED_SHA}" origin/main
          test -z "$(git status --porcelain)"
          node scripts/prepare-flo-staging.mjs

      - name: Install locked dependencies and test source
        run: |
          npm ci
          node --check server.mjs
          find lib test scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npm test
          npx playwright-core install chromium
          node scripts/smoke-flo-ui.mjs

      - name: Sign in with the staging workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.STAGING_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.STAGING_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.STAGING_AZURE_SUBSCRIPTION_ID }}

      - name: Verify isolated staging resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id --output tsv)" = '${{ vars.STAGING_AZURE_SUBSCRIPTION_ID }}'
          az group show --name "${STAGING_RESOURCE_GROUP}" --query id --output tsv > /dev/null
          az resource show --ids "${STAGING_ENVIRONMENT_ID}" --query id --output tsv > /dev/null
          az resource show --ids "${STAGING_RUNTIME_IDENTITY_RESOURCE_ID}" --query id --output tsv > /dev/null
          vault_name="${STAGING_KEY_VAULT_URI#https://}"
          vault_name="${vault_name%%.*}"
          az keyvault show --resource-group "${STAGING_RESOURCE_GROUP}" --name "${vault_name}" \
            --query id --output tsv > /dev/null
          for certificate in "${STAGING_API_CERTIFICATE_ID}" "${STAGING_APP_CERTIFICATE_ID}" "${STAGING_FLO_CERTIFICATE_ID}"; do
            az resource show --ids "${certificate}" --query id --output tsv > /dev/null
          done
          for identity in "${STAGING_MERCHANT_IDENTITY_NAME}" "${STAGING_BSA_IDENTITY_NAME}" "${STAGING_OCR_IDENTITY_NAME}" "${STAGING_EJARI_IDENTITY_NAME}"; do
            az identity show --resource-group "${STAGING_RESOURCE_GROUP}" --name "${identity}" --query id --output tsv > /dev/null
          done
          for account in "${STAGING_BSA_STORAGE_NAME}" "${STAGING_OCR_STORAGE_NAME}" "${STAGING_FLO_STORAGE_NAME}" "${STAGING_EJARI_STORAGE_NAME}" "${STAGING_DEEP_RESEARCH_STORAGE_NAME}" "${STAGING_GDELT_STORAGE_NAME}" "${STAGING_REPORT_STORAGE_NAME}" "${STAGING_ADVERSE_JSON_STORAGE_NAME}"; do
            az storage account show --resource-group "${STAGING_RESOURCE_GROUP}" --name "${account}" \
              --query '{publicNetworkAccess:publicNetworkAccess,allowSharedKeyAccess:allowSharedKeyAccess}' --output json \
              | jq -e '.publicNetworkAccess == "Disabled" and .allowSharedKeyAccess == false' > /dev/null
          done
          for account in "${STAGING_OCR_STORAGE_NAME}" "${STAGING_FLO_STORAGE_NAME}"; do
            storage_id="$(az storage account show --resource-group "${STAGING_RESOURCE_GROUP}" --name "${account}" --query id --output tsv)"
            node scripts/verify-flo-private-storage.mjs "${storage_id}"
          done
          flo_storage_id="$(az storage account show --resource-group "${STAGING_RESOURCE_GROUP}" --name "${STAGING_FLO_STORAGE_NAME}" --query id --output tsv)"
          runtime_principal="$(az identity show --ids "${STAGING_RUNTIME_IDENTITY_RESOURCE_ID}" --query principalId --output tsv)"
          az role assignment list --assignee-object-id "${runtime_principal}" --scope "${flo_storage_id}" --include-inherited --output json \
            | jq -e '[.[].roleDefinitionName] as $roles | all("Storage Blob Data Contributor", "Storage Table Data Contributor", "Storage Queue Data Contributor"; . as $role | $roles | index($role) != null)' > /dev/null

      - name: Validate staging Bicep
        run: |
          az bicep build --file infrastructure/api.bicep --outfile /tmp/flo-staging-api.json
          az bicep build --file infrastructure/api-flo-platform.bicep --outfile /tmp/flo-staging-storage.json

      - name: Build and publish reviewed API image
        id: image
        shell: bash
        env:
          STAGING_ACR_NAME: ${{ vars.STAGING_ACR_NAME }}
        run: |
          set -euo pipefail
          test -n "${STAGING_ACR_NAME}"
          az acr login --name "${STAGING_ACR_NAME}"
          reviewed_sha="$(git rev-parse HEAD)"
          tagged_image="${STAGING_ACR_LOGIN_SERVER}/ai7uae-api-flo-staging:${reviewed_sha}"
          docker build --pull --file Dockerfile.api --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(az acr repository show --name "${STAGING_ACR_NAME}" --image "ai7uae-api-flo-staging:${reviewed_sha}" --query digest --output tsv)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${STAGING_ACR_LOGIN_SERVER}/ai7uae-api-flo-staging@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Prepare staging-only deployment parameters
        env:
          STAGING_API_IMAGE: ${{ steps.image.outputs.image }}
        run: node scripts/prepare-flo-staging.mjs --output /tmp/flo-staging.parameters.json

      - name: Preview staging Flo storage and API changes
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if --resource-group "${STAGING_RESOURCE_GROUP}" \
            --name "flo-staging-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-flo-platform.bicep --parameters storageAccountName="${STAGING_FLO_STORAGE_NAME}"
          az deployment group what-if --resource-group "${STAGING_RESOURCE_GROUP}" \
            --name "flo-staging-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep --parameters @/tmp/flo-staging.parameters.json

      - name: Deploy staging Flo storage and digest-pinned API
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create --resource-group "${STAGING_RESOURCE_GROUP}" \
            --name "flo-staging-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api-flo-platform.bicep --parameters storageAccountName="${STAGING_FLO_STORAGE_NAME}"
          az deployment group create --resource-group "${STAGING_RESOURCE_GROUP}" \
            --name "flo-staging-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infrastructure/api.bicep --parameters @/tmp/flo-staging.parameters.json

      - name: Verify staging hosts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "https://${STAGING_API_HOST}/healthz" > /dev/null
          curl --fail --silent --show-error --max-time 30 "https://${STAGING_APP_HOST}/login" > /dev/null
          curl --fail --silent --show-error --max-time 30 "https://${STAGING_FLO_HOST}/flo" > /dev/null

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BSA_LOCAL_ENABLED: "1"
      BSA_DATA_DIR: /data
      BSA_DATA_KEY_HEX: ${BSA_DATA_KEY_HEX:?Set a 64-character local encryption key}
      AI7_API_KEY_HASHES: ${AI7_API_KEY_HASHES:?Set the hash of your local demo key}
      AI7_ADMIN_KEY_HASHES: ${AI7_ADMIN_KEY_HASHES:?Set the hash of your local admin demo key}
    volumes:
      - bsa-data:/data
  bsa-worker:
    build: ./bank-statement-analysis
    environment:
      BSA_DATA_DIR: /data
      BSA_DATA_KEY_HEX: ${BSA_DATA_KEY_HEX:?Set the same local encryption key}
      BSA_MANAGED_EXTRACTION_APPROVED: ${BSA_MANAGED_EXTRACTION_APPROVED:-0}
      BSA_AZURE_LAYOUT_ENDPOINT: ${BSA_AZURE_LAYOUT_ENDPOINT:-}
      BSA_AZURE_LAYOUT_KEY: ${BSA_AZURE_LAYOUT_KEY:-}
      BSA_AZURE_LAYOUT_REGION: ${BSA_AZURE_LAYOUT_REGION:-}
      BSA_APPROVED_PROCESSING_REGION: ${BSA_APPROVED_PROCESSING_REGION:-}
      BSA_MANAGED_MAX_PAGES: ${BSA_MANAGED_MAX_PAGES:-0}
      BSA_MANAGED_MAX_COST_USD: ${BSA_MANAGED_MAX_COST_USD:-}
      BSA_MANAGED_ESTIMATED_PAGE_COST_USD: ${BSA_MANAGED_ESTIMATED_PAGE_COST_USD:-}
      BSA_WORKER_TIMEOUT_SECONDS: ${BSA_WORKER_TIMEOUT_SECONDS:-600}
    volumes:
      - bsa-data:/data
volumes:
  bsa-data:

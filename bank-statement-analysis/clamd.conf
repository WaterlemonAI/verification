Foreground yes
LogTime yes
LogClean no
LogVerbose no
User bsa
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 200
MaxThreads 4
MaxQueue 16
MaxConnectionQueueLength 16
MaxScanSize 30M
MaxFileSize 30M
StreamMaxLength 30M
MaxRecursion 12
MaxFiles 1000
SelfCheck 600
Bytecode yes
DetectPUA yes

[project]
name = "ai7-bsa-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pypdf>=6,<7", "networkx>=3,<4", "rapidocr==3.10.0", "paddleocr==3.7.0", "python-bidi>=0.6,<1", "onnxruntime>=1.20,<2", "pymupdf>=1.26,<3", "pdfplumber>=0.11,<1", "Pillow>=11,<13", "polars>=1,<2", "reportlab>=4,<5", "cryptography>=43,<48", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
bsa = ["bank_profiles/*.json"]
